# Déploie le site sur Firebase Hosting à chaque push sur main.
# Prérequis : le secret FIREBASE_SERVICE_ACCOUNT_ELECTION_WUT_S (clé JSON d'un compte de service du projet).
name: Déploiement Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firebase-hosting
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ELECTION_WUT_S }}
          projectId: election-wut-s
          channelId: live
